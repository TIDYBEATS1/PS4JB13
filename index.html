<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #080a0d;
  color: #c8ced8;
  font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
}

body {
  min-height: 100vh;
}

/* =========================
   HEADER
   ========================= */

#brand {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  padding: 8px 16px;

  background: #0d1015;
  border-bottom: 1px solid #202832;

  box-shadow: 0 2px 14px rgba(0,0,0,.28);
}

#brand img {
  width: 32px;
  height: 32px;
  border-radius: 50%;
}

#brand b {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .18em;
  color: #eef2f7;
}

/* =========================
   MAIN
   ========================= */

#wrap {
  width: min(760px, calc(100% - 28px));
  margin: 0 auto;
  padding: 30px 0 40px;
}

/* =========================
   MAIN CARD
   ========================= */

#card {
  background: #0e1218;
  border: 1px solid #202832;
  border-radius: 12px;
  padding: 28px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.02);
}

/* =========================
   STATUS
   ========================= */

#statusIcon {
  width: 58px;
  height: 58px;

  margin: 0 auto 18px;

  border: 4px solid #202832;
  border-top-color: #7fd0a0;
  border-radius: 50%;

  animation: spin .9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

#state {
  margin: 0;

  text-align: center;

  font-size: 24px;
  font-weight: 700;

  color: #edf1f6;
}

#det {
  margin-top: 7px;

  text-align: center;

  color: #7f8997;
  font-size: 13px;
}

#det b {
  color: #c8ced8;
  font-weight: 600;
}

/* =========================
   CACHE STATUS
   ========================= */

#cache {
  margin-top: 6px;

  min-height: 20px;

  text-align: center;

  color: #687382;
  font-size: 12px;
}

#cache.cacheok {
  color: #7fd0a0;
}

/* =========================
   PROGRESS
   ========================= */

#progressArea {
  margin-top: 30px;
}

#progressTop {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 8px;

  color: #737e8d;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
}

#progressPercent {
  color: #aeb8c6;
  letter-spacing: 0;
}

#progressTrack {
  width: 100%;
  height: 9px;

  overflow: hidden;

  background: #181e26;
  border: 1px solid #252e39;
  border-radius: 99px;
}

#progressBar {
  width: 35%;
  height: 100%;

  background: #7fd0a0;
  border-radius: 99px;

  transition: width .25s ease;
}

/* Animated state while checking/downloading */
body.loading #progressBar {
  animation: progressPulse 1.6s ease-in-out infinite;
}

@keyframes progressPulse {
  0% {
    transform: translateX(-120%);
  }

  50% {
    transform: translateX(80%);
  }

  100% {
    transform: translateX(300%);
  }
}

/* =========================
   INFORMATION
   ========================= */

#info {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 12px;

  margin-top: 22px;
}

.infoBox {
  padding: 13px 15px;

  background: #0a0d12;

  border: 1px solid #1d252f;
  border-radius: 7px;
}

.infoLabel {
  margin-bottom: 4px;

  color: #687382;

  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.infoValue {
  color: #cbd3de;

  font-size: 13px;
}

/* =========================
   MESSAGES
   ========================= */

#action {
  display: none;

  margin-top: 20px;
  padding: 14px 16px;

  text-align: center;

  background: #121820;

  border: 1px solid #26313d;
  border-radius: 7px;

  color: #d8c07f;
  font-size: 14px;
}

#action::after {
  content: "  •  Press X or tap the screen";
  color: #687382;
  font-size: 12px;
}

/* =========================
   SUCCESS
   ========================= */

body.success #statusIcon {
  display: none;
}

body.success #state {
  color: #7fd0a0;
}

body.success #progressBar {
  width: 100%;
  animation: none;
}

body.success #progressPercent {
  color: #7fd0a0;
}

/* =========================
   WARNING
   ========================= */

body.warning #statusIcon {
  border-top-color: #d8c07f;
}

body.warning #state {
  color: #d8c07f;
}

body.warning #action {
  display: block;
}

/* =========================
   ERROR
   ========================= */

body.error #statusIcon {
  display: none;
}

body.error #state {
  color: #d08a7f;
}

body.error #progressBar {
  background: #d08a7f;
  animation: none;
}

/* =========================
   COLOURS
   ========================= */

.ok {
  color: #7fd0a0;
}

.bad {
  color: #d08a7f;
}

.warn {
  color: #d8c07f;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  #wrap {
    width: calc(100% - 18px);
    padding-top: 18px;
  }

  #card {
    padding: 21px;
  }

  #info {
    grid-template-columns: 1fr;
  }

  #state {
    font-size: 21px;
  }
}
</style>
</head>

<body class="loading">

<div id="brand">

  <!-- KEEP YOUR EXISTING BASE64 LOGO IMAGE EXACTLY HERE -->
  <!-- Replace this entire img element with the one from your current index.html -->

  <img
    src="data:image/png;base64,PASTE-YOUR-EXISTING-BASE64-IMAGE-HERE"
    alt=""
    width="32"
    height="32"
  >

  <b>RAW GAME</b>

</div>

<div id="wrap">

  <div id="card">

    <div id="statusIcon"></div>

    <div id="state">
      detecting firmware...
    </div>

    <div id="det"></div>

    <div id="cache">
      checking cache...
    </div>

    <div id="progressArea">

      <div id="progressTop">
        <span>OFFLINE CACHE</span>
        <span id="progressPercent">CHECKING</span>
      </div>

      <div id="progressTrack">
        <div id="progressBar"></div>
      </div>

    </div>

    <div id="info">

      <div class="infoBox">
        <div class="infoLabel">
          Firmware
        </div>

        <div class="infoValue" id="firmwareValue">
          Detecting...
        </div>
      </div>

      <div class="infoBox">
        <div class="infoLabel">
          System
        </div>

        <div class="infoValue">
          PlayStation 4
        </div>
      </div>

    </div>

    <div id="action"></div>

  </div>

</div>

<script>
(function () {

    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    var progressBar = document.getElementById("progressBar");
    var progressPercent = document.getElementById("progressPercent");
    var firmwareValue = document.getElementById("firmwareValue");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    function setProgress(value, text) {
        if (typeof value === "number") {
            value = Math.max(0, Math.min(100, value));

            progressBar.style.width = value + "%";
            progressBar.style.transform = "none";

            progressPercent.textContent = Math.round(value) + "%";
        } else {
            progressPercent.textContent = text || "CHECKING";
        }
    }

    function setMode(mode) {
        document.body.classList.remove(
            "loading",
            "success",
            "warning",
            "error"
        );

        if (mode) {
            document.body.classList.add(mode);
        }
    }

    var params = new URLSearchParams(location.search);

    /*
     * Firmwares this build has a MEASURED kernel table for.
     * This remains UX-only. jb.js performs its own checks.
     */
    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null;
    var fwnum = null;

    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(
        navigator.userAgent
    );

    if (m) {

        var ms = parseInt(m[2], 16).toString(16);

        if (ms.length < 2) {
            ms = "0" + ms;
        }

        key = m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    firmwareValue.textContent = key || "Unknown";

    var forced = params.get("force") === "1";

    var supported =
        forced ||
        (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML =
        "firmware <b>" +
        (key || "unknown") +
        "</b>" +
        (
            supported
            ? " &middot; <b>supported</b>"
            : " &middot; not in this build's kernel table"
        );

    var target = "jb.html" + location.search;

    function go() {

        setMode("success");

        setState(
            "loading jailbreak...",
            "warn"
        );

        setProgress(100, "READY");

        setCache(
            "cache ready",
            true
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        setMode("warning");

        setState(
            msg,
            "warn"
        );

        setProgress(null, "WAITING");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    /*
     * Unsupported firmware
     */

    if (!supported) {

        setMode("warning");

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );

        setProgress(
            0,
            "UNSUPPORTED"
        );

        waitForTap(
            "UNSUPPORTED (" +
            (key || "unknown") +
            ") — run anyway?",
            go
        );

        return;
    }

    /*
     * Supported firmware
     */

    var ac = window.applicationCache;

    if (
        !ac ||
        !document.documentElement.hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline — loading from cache",
            true
        );

        setProgress(
            100,
            "CACHED"
        );

        go();

    } else if (ac.status === ac.IDLE) {

        setCache(
            "cached",
            true
        );

        setProgress(
            100,
            "READY"
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        setProgress(
            100,
            "UPDATE"
        );

        waitForTap(
            "UPDATE READY — reload to run",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking cache..."
        );

        setProgress(
            null,
            "CHECKING"
        );

        ac.addEventListener(
            "downloading",
            function () {

                setCache(
                    "caching for offline use..."
                );

                setProgress(
                    null,
                    "DOWNLOADING"
                );
            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    var pct =
                        Math.round(
                            (e.loaded / e.total) * 100
                        );

                    setCache(
                        "caching " +
                        pct +
                        "%"
                    );

                    setProgress(
                        pct,
                        pct + "%"
                    );
                }
            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                setProgress(
                    100,
                    "100%"
                );

                waitForTap(
                    "CACHED — ready to run",
                    go
                );
            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                setProgress(
                    100,
                    "UPDATE"
                );

                waitForTap(
                    "UPDATE READY — reload to run",
                    function () {
                        location.reload();
                    }
                );
            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached — offline ready",
                    true
                );

                setProgress(
                    100,
                    "READY"
                );

                go();
            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                setMode("warning");

                setCache(
                    "cache unavailable"
                );

                setProgress(
                    0,
                    "ERROR"
                );

                waitForTap(
                    "CACHE FAILED — run anyway",
                    go
                );
            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                setMode("warning");

                setCache(
                    "cache obsolete"
                );

                setProgress(
                    0,
                    "OBSOLETE"
                );

                waitForTap(
                    "CACHE OBSOLETE — run anyway",
                    go
                );
            },
            false
        );
    }

})();
</script>

</body>
</html>
